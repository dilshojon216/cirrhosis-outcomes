seed: 42
n_folds: 5

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: models
  oof_dir: outputs/oof
  submissions_dir: outputs/submissions
  figures_dir: outputs/figures
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  original: data/raw/cirrhosis.csv

data:
  id_col: id
  target: Status
  classes: [C, CL, D]           # tartib submission ustunlari bilan bir xil
  use_original: false           # Faza 5 da solishtiriladi
  numeric_cols:
    - N_Days
    - Age
    - Bilirubin
    - Cholesterol
    - Albumin
    - Copper
    - Alk_Phos
    - SGOT
    - Tryglicerides
    - Platelets
    - Prothrombin
  categorical_cols:
    - Drug
    - Sex
    - Ascites
    - Hepatomegaly
    - Spiders
    - Edema
    - Stage
  log_cols: [Bilirubin, Copper, Alk_Phos, SGOT, Cholesterol]

models:
  logreg:
    C: 1.0
    max_iter: 2000

  lgbm:
    objective: multiclass
    num_class: 3
    metric: multi_logloss
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_estimators: 5000
    early_stopping_rounds: 200
    verbose: -1

  xgb:
    objective: multi:softprob
    num_class: 3
    eval_metric: mlogloss
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.5
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_estimators: 5000
    early_stopping_rounds: 200
    tree_method: hist

  catboost:
    loss_function: MultiClass
    eval_metric: MultiClass
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3.0
    iterations: 5000
    early_stopping_rounds: 200
    verbose: 0
