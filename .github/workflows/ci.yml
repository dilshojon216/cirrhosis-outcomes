name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      # Testlar haqiqiy Kaggle/UCI ma'lumotiga bog'liq emas — sintetik
      # fixture'lar (tests/conftest.py) bilan ishlaydi, shuning uchun
      # `data/raw/` bu yerda kerak emas.
      - name: Testlar (pytest)
        run: pytest tests/ -v
