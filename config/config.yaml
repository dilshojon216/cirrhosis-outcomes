seed: 42
n_folds: 5

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: models
  oof_dir: outputs/oof
  submissions_dir: outputs/submissions
  figures_dir: outputs/figures
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  original: data/raw/cirrhosis.csv

data:
  id_col: id
  target: Status
  classes: [C, CL, D]           # tartib submission ustunlari bilan bir xil
  use_original: true            # Faza 5da solishtirildi: original UCI qo'shish barqaror yordam berdi
                                 # (LightGBM: 0.37235 -> 0.36880 "baza" feature to'plamida, 03_experiments.ipynb)
  numeric_cols:
    - N_Days
    - Age
    - Bilirubin
    - Cholesterol
    - Albumin
    - Copper
    - Alk_Phos
    - SGOT
    - Tryglicerides
    - Platelets
    - Prothrombin
  categorical_cols:
    - Drug
    - Sex
    - Ascites
    - Hepatomegaly
    - Spiders
    - Edema
    - Stage
  log_cols: [Bilirubin, Copper, Alk_Phos, SGOT, Cholesterol]

models:
  logreg:
    C: 1.0
    max_iter: 2000

  hgb:                          # sklearn HistGradientBoostingClassifier — Faza 4 baseline, tuning qilinmaydi
    max_iter: 300
    learning_rate: 0.1
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0

  lgbm:                         # Optuna bilan sozlandi (Faza 5, 03_experiments.ipynb, 25 trial,
                                 # "baza"+original feature to'plamida): CV log_loss 0.36880 -> 0.36288.
                                 # Sozlanmagan defaultlar edi: learning_rate=0.03, num_leaves=31,
                                 # max_depth=-1, min_child_samples=20, subsample=0.8, colsample_bytree=0.5,
                                 # reg_alpha=0.1, reg_lambda=1.0
    objective: multiclass
    num_class: 3
    metric: multi_logloss
    learning_rate: 0.015982777382214743
    num_leaves: 72
    max_depth: 3
    min_child_samples: 24
    subsample: 0.5902742208077648
    subsample_freq: 1
    colsample_bytree: 0.40411832025914196
    reg_alpha: 0.5531279368834987
    reg_lambda: 0.0035312541987781885
    n_estimators: 5000
    early_stopping_rounds: 200
    verbose: -1

  xgb:
    objective: multi:softprob
    num_class: 3
    eval_metric: mlogloss
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.5
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_estimators: 5000
    early_stopping_rounds: 200
    tree_method: hist

  catboost:
    loss_function: MultiClass
    eval_metric: MultiClass
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3.0
    iterations: 5000
    early_stopping_rounds: 200
    verbose: 0
